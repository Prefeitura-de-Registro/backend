name: CI Backend

on:
  pull_request:
    branches: [ develop, homologacao, main, 'release/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm ci
    - run: npm run prisma:generate
    - run: npm run lint
    - run: npm run format
    - run: npm run test
      env:
        JWT_SECRET: ci-test-secret
    - run: npm run build
